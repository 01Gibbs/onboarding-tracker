<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Accounts API request path</title>
  <desc id="desc">An HTTP request from Bruno passes through the Spring Security filter chain, then AccountController, AccountService, AccountRepository and the H2 database. ApiExceptionHandler, beside the controller, turns exceptions into problem-detail responses. The filter chain answers 401 or 403 itself. AccountService and the security event listener write to the security.audit log. AccountService, AccountRepository and H2 sit inside a @Transactional boundary.</desc>
  <style>
    .box   { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .sec   { stroke: #bf8700; }
    .err   { stroke: #cf222e; }
    .aud   { stroke: #8250df; }
    .db    { stroke: #1a7f37; }
    .t     { fill: #1f2328; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
    .s     { fill: #59636e; font-size: 11px; text-anchor: middle; }
    .lbl   { fill: #768390; font-size: 11px; }
    .head  { fill: #768390; font-size: 13px; font-weight: 600; }
    .flow  { stroke: #768390; stroke-width: 1.8; fill: none; }
    .side  { stroke: #768390; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .tx    { stroke: #768390; stroke-width: 1; fill: none; stroke-dasharray: 2 4; }
    .tip   { fill: #768390; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .sec { stroke: #d29922; }
      .err { stroke: #f85149; }
      .aud { stroke: #a371f7; }
      .db  { stroke: #3fb950; }
      .t   { fill: #e6edf3; }
      .s   { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="head" x="12" y="24">Accounts API: the path of one request (Days 14–19)</text>

  <!-- @Transactional boundary (Day 19) -->
  <rect class="tx" x="458" y="160" width="436" height="96" rx="10"/>
  <text class="lbl" x="888" y="154" text-anchor="end">@Transactional: all or nothing (Day 19)</text>

  <!-- Main row -->
  <rect class="box" x="12"  y="180" width="100" height="64" rx="8"/>
  <text class="t" x="62"  y="207">Bruno</text>
  <text class="s" x="62"  y="226">HTTP client</text>

  <rect class="box sec" x="140" y="180" width="130" height="64" rx="8"/>
  <text class="t" x="205" y="207">Spring Security</text>
  <text class="s" x="205" y="226">filter chain</text>

  <rect class="box" x="298" y="180" width="142" height="64" rx="8"/>
  <text class="t" x="369" y="207">AccountController</text>
  <text class="s" x="369" y="226">@RestController</text>

  <rect class="box" x="468" y="180" width="126" height="64" rx="8"/>
  <text class="t" x="531" y="207">AccountService</text>
  <text class="s" x="531" y="226">@Service</text>

  <rect class="box" x="622" y="180" width="142" height="64" rx="8"/>
  <text class="t" x="693" y="207">AccountRepository</text>
  <text class="s" x="693" y="226">JpaRepository</text>

  <rect class="box db" x="792" y="180" width="96" height="64" rx="8"/>
  <text class="t" x="840" y="207">H2</text>
  <text class="s" x="840" y="226">data/accounts</text>

  <line class="flow" x1="112" y1="212" x2="138" y2="212" marker-end="url(#arrow)"/>
  <line class="flow" x1="270" y1="212" x2="296" y2="212" marker-end="url(#arrow)"/>
  <line class="flow" x1="440" y1="212" x2="466" y2="212" marker-end="url(#arrow)"/>
  <line class="flow" x1="594" y1="212" x2="620" y2="212" marker-end="url(#arrow)"/>
  <line class="flow" x1="764" y1="212" x2="790" y2="212" marker-end="url(#arrow)"/>

  <!-- ApiExceptionHandler, beside the controller -->
  <rect class="box err" x="274" y="48" width="190" height="72" rx="8"/>
  <text class="t" x="369" y="72">ApiExceptionHandler</text>
  <text class="s" x="369" y="90">@RestControllerAdvice</text>
  <text class="s" x="369" y="107">exception → ProblemDetail</text>
  <path class="side" d="M369,180 V123" marker-end="url(#arrow)"/>
  <text class="lbl" x="376" y="157">exceptions</text>
  <path class="side" d="M274,84 H50 V177" marker-end="url(#arrow)"/>
  <text class="lbl" x="66" y="78">problem detail JSON (400, 404…)</text>

  <!-- The filter chain answers 401 / 403 itself -->
  <path class="side" d="M205,180 V148 H74 V177" marker-end="url(#arrow)"/>
  <text class="lbl" x="96" y="142">401 / 403, no controller</text>

  <!-- security.audit log, beside the service -->
  <rect class="box aud" x="441" y="300" width="180" height="64" rx="8"/>
  <text class="t" x="531" y="327">security.audit log</text>
  <text class="s" x="531" y="346">who · what · why, no passwords</text>
  <path class="side" d="M531,244 V297" marker-end="url(#arrow)"/>
  <text class="lbl" x="538" y="276">ACCESS_DENIED</text>
  <path class="side" d="M205,244 V332 H438" marker-end="url(#arrow)"/>
  <text class="lbl" x="214" y="325">LOGIN_FAILED (SecurityAuditListener)</text>

  <!-- Legend -->
  <line class="flow" x1="12" y1="402" x2="44" y2="402" marker-end="url(#arrow)"/>
  <text class="lbl" x="52" y="406">request</text>
  <path class="side" d="M120,402 H152" marker-end="url(#arrow)"/>
  <text class="lbl" x="160" y="406">error response or audit event</text>
  <path class="tx" d="M340,402 H372"/>
  <text class="lbl" x="380" y="406">transaction boundary</text>
</svg>
