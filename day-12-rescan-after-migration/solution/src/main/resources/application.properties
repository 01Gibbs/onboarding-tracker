spring.application.name=accounts

spring.datasource.url=jdbc:h2:file:./data/accounts
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Login for the API (HTTP Basic)
spring.security.user.name=teller
spring.security.user.password=teller-pass

# The H2 console is only switched on in the dev profile (application-dev.properties)

# Only expose what monitoring needs. Everything else stays off.
management.endpoints.web.exposure.include=health,info

# Credential for the FX-rates provider: read from the environment, never committed
accounts.fx-provider.api-credential=${FX_API_CREDENTIAL:}
