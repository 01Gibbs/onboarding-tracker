spring.application.name=accounts

spring.datasource.url=jdbc:h2:file:./data/accounts
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Login for the API (HTTP Basic)
spring.security.user.name=teller
spring.security.user.password=teller-pass

# H2 console, so ops can poke at the data
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Expose everything, handy for debugging
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true

# Credential for the FX-rates provider
accounts.fx-provider.api-credential=fxp_live_9f2c41d7e8a64b0c
