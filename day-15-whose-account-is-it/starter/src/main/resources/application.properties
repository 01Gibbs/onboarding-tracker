spring.application.name=accounts

# H2 database stored in a file under ./data, so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/accounts
spring.datasource.username=sa
spring.datasource.password=

# Create/alter tables to match our @Entity classes (fine for learning, not for production)
spring.jpa.hibernate.ddl-auto=update
# Print the SQL Hibernate runs, so you can see what's happening
spring.jpa.show-sql=true

# Browser UI for the database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
